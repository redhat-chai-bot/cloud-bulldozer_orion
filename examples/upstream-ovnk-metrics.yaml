# Shared OVN/OVS metrics for upstream OVN-Kubernetes workloads.
#
# Covers pod latency, per-container OVN CPU/Memory (via fan_out),
# and OVS vswitch CPU/Memory.  Referenced by upstream-ovnk.yaml.

- name: podReadyLatency
  metricName.keyword: podLatencyQuantilesMeasurement
  quantileName: Ready
  metric_of_interest: P99
  not:
    jobName.keyword: garbage-collection
  labels:
    - "[Jira: PerfScale]"
  direction: 1
  threshold: 10

- name: containersStartedLatency
  metricName.keyword: podLatencyQuantilesMeasurement
  quantileName: ContainersStarted
  metric_of_interest: P99
  labels:
    - "[Jira: PodLatency]"
  direction: 1
  threshold: 25

- name: ovsCPU-irate-all
  metricName.keyword: cgroupCPU
  labels.id.keyword: /system.slice/ovs-vswitchd.service
  metric_of_interest: value
  agg:
    agg_type: avg
  labels:
    - "[Jira: Networking / ovn-kubernetes]"
  direction: 1
  threshold: 10

- name: ovnkCPU-overall
  metricName.keyword: containerCPU
  labels.namespace.keyword: openshift-ovn-kubernetes
  metric_of_interest: value
  agg:
    agg_type: avg
  labels:
    - "[Jira: Networking / ovn-kubernetes]"
  direction: 1
  threshold: 10

- name: "ovnCPU-${suffix}"
  metricName.keyword: containerCPU
  labels.namespace.keyword: openshift-ovn-kubernetes
  labels.container.keyword: "${container}"
  metric_of_interest: value
  agg:
    agg_type: avg
  labels:
    - "[Jira: Networking / ovn-kubernetes]"
  direction: 1
  threshold: 10
  fan_out:
    - suffix: ovncontroller
      container: ovn-controller
    - suffix: northd
      container: northd
    - suffix: nbdb
      container: nbdb
    - suffix: sbdb
      container: sbdb
    - suffix: ovnk-controller
      container: ovnkube-controller

- name: "ovsMemory-${node}"
  metricName.keyword: "cgroupMemoryRSS-${node}"
  labels.id.keyword: /system.slice/ovs-vswitchd.service
  metric_of_interest: value
  agg:
    agg_type: max
  labels:
    - "[Jira: Networking / ovn-kubernetes]"
  direction: 1
  threshold: 10
  fan_out:
    - node: Workers
    - node: Masters

- name: ovsMemory-all
  metricName.keyword: cgroupMemoryRSS
  labels.id.keyword: /system.slice/ovs-vswitchd.service
  metric_of_interest: value
  agg:
    agg_type: avg
  labels:
    - "[Jira: Networking / ovn-kubernetes]"
  direction: 1
  threshold: 10

- name: ovnkMem-overall
  metricName.keyword: containerMemory
  labels.namespace.keyword: openshift-ovn-kubernetes
  metric_of_interest: value
  agg:
    agg_type: avg
  labels:
    - "[Jira: Networking / ovn-kubernetes]"
  direction: 1
  threshold: 10

- name: "ovnMem-${suffix}"
  metricName.keyword: containerMemory
  labels.namespace.keyword: openshift-ovn-kubernetes
  labels.container.keyword: "${container}"
  metric_of_interest: value
  agg:
    agg_type: avg
  labels:
    - "[Jira: Networking / ovn-kubernetes]"
  direction: 1
  threshold: 10
  fan_out:
    - suffix: ovncontroller
      container: ovn-controller
    - suffix: northd
      container: northd
    - suffix: nbdb
      container: nbdb
    - suffix: sbdb
      container: sbdb
    - suffix: ovnk-controller
      container: ovnkube-controller

- name: kubelet
  metricName.keyword: kubeletCPU
  metric_of_interest: value
  labels:
    - "[Jira: Node]"
  agg:
    agg_type: avg
  direction: 1
  threshold: 10
